name: Referee
on:
  workflow_dispatch:
  push:
    branches: [main]
  workflow_run:
    workflows: [Vote signal]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: git-nomic-referee
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.ref == 'refs/heads/main' && vars.PROOF_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # REQUIRED: configure this environment to allow branch main only.
    # The private key must be an environment secret, never a repository secret.
    environment: referee-main
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.REFEREE_CLIENT_ID }}
          private-key: ${{ secrets.REFEREE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Run only the installed referee
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          echo 'workflow-v2'
          python referee.py --installed-sha "$(git rev-parse HEAD)" --apply
