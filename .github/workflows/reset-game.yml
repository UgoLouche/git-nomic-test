name: Reset game
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESET to clear scores/history and restart with current players/rules'
        required: true
        type: string
permissions:
  contents: read
# Serialize with regular reconciliation, including the push caused by this reset.
concurrency:
  group: git-nomic-referee
  cancel-in-progress: false
jobs:
  reset:
    # Both original dispatch and any re-run must be by the personal repo owner.
    if: >-
      github.ref == 'refs/heads/main' && inputs.confirm == 'RESET' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: referee-main
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.REFEREE_CLIENT_ID }}
          private-key: ${{ secrets.REFEREE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Reset only state, retaining Git history and installed rules
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          python reset_game.py --repo "$GITHUB_REPOSITORY" \
            --installed-sha "$(git rev-parse HEAD)" \
            --apply --confirm-reset "$GITHUB_REPOSITORY"
