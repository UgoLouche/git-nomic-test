name: Proposal tests
run-name: 'Pytest PR #${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }}'
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
# Proposed code runs only on a disposable, unprivileged runner. No environment,
# secrets, credentialed checkout, shared caches, or privileged follow-up steps.
permissions: {}
concurrency:
  group: git-nomic-pytest-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pytest:
    name: pytest
    if: '!github.event.pull_request.draft'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest==9.0.2
      - name: Fetch the exact proposal revision without credentials
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        shell: bash
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init proposal
          git -C proposal remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C proposal -c credential.helper= fetch --no-tags --depth=1 origin "refs/pull/${PR_NUMBER}/head"
          test "$(git -C proposal rev-parse FETCH_HEAD)" = "$PR_HEAD_SHA"
          git -C proposal checkout --detach FETCH_HEAD
      - name: Run pytest
        working-directory: proposal
        run: python -m pytest -q
